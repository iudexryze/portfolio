<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IudexRzye — Varun Saini</title>
<meta name="description" content="A handheld console you can actually use. Varun Saini's portfolio: games, Unity editor tools, 3D work, and a browser arcade — all of it read through the screen of a small grey machine.">
<meta name="theme-color" content="#0F1113">
<link rel="canonical" href="https://iudexryze.github.io/portfolio/">
<meta property="og:title" content="IudexRzye — Varun Saini">
<meta property="og:description" content="A handheld console you can actually use. Games, editor tools, 3D work and an arcade, navigated entirely with the D-pad.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://iudexryze.github.io/portfolio/">
<meta name="twitter:card" content="summary_large_image">
<meta name="author" content="Varun Saini">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/console.css">
</head>
<body>

<div class="stage" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<p class="warming" id="warming">WARMING UP</p>

<div class="shellwrap">
  <div class="lcdmount">
    <div class="well"><canvas class="lcd" id="lcd" width="960" height="864" aria-hidden="true"></canvas></div>
    <p class="wordmark">IudexRzye</p>
  </div>

  <div class="pad" id="pad">
    <div class="row">
      <div class="dpad">
        <button class="u" data-btn="up" aria-label="Up">▲</button>
        <button class="l" data-btn="left" aria-label="Left">◀</button>
        <button class="r" data-btn="right" aria-label="Right">▶</button>
        <button class="d" data-btn="down" aria-label="Down">▼</button>
      </div>
      <div class="ab">
        <button data-btn="b" aria-label="B — go back">B</button>
        <button data-btn="a" aria-label="A — select">A</button>
      </div>
    </div>
    <div class="se">
      <button data-btn="select" aria-label="Select">SELECT</button>
      <button data-btn="start" aria-label="Start — main menu">START</button>
    </div>
    <div class="sys">
      <button data-btn="power" aria-label="Power switch">POWER</button>
      <button data-btn="contrast" aria-label="Contrast dial — change screen colour">CONTRAST</button>
      <button data-btn="volume" aria-label="Volume dial — mute or unmute">VOLUME</button>
    </div>
  </div>
</div>

<div class="chrome">
  <header class="masthead">
    <h1 class="who">Varun Saini<span>Game developer and technical artist</span></h1>
    <p class="reach">
      <span class="on"><i></i>Open to work</span>
      <b>Bangalore, India</b>
      <a href="mailto:varun2002saini19@gmail.com">varun2002saini19@gmail.com</a>
    </p>
  </header>
  <footer class="footbar">
    <p class="legend" id="legend" aria-hidden="true"></p>
    <p class="escape">
      <a href="page.html">Read it as a page</a>
      <a href="https://github.com/iudexryze" rel="noopener">GitHub</a>
    </p>
  </footer>
</div>

<div class="cart" id="cart" role="dialog" aria-modal="true" aria-label="Game running">
  <div class="cart-bar">
    <span>NOW PLAYING <b id="cart-name">—</b></span>
    <button type="button" id="cart-eject">EJECT · ESC</button>
  </div>
  <iframe id="cart-frame" title="Game" allow="autoplay; fullscreen"></iframe>
</div>

<p class="sr" id="say" role="status" aria-live="polite"></p>
<noscript><p style="padding:40px;max-width:60ch">This page is a small machine that needs JavaScript to switch on. The same work, as ordinary text, is <a href="page.html" style="color:#8FC93A">on the text version of this page</a>.</p></noscript>

<!-- ═══════════════════════════════════════════════════════════════
     THE MACHINE — content, screen and controls.
     Deliberately a plain script: if the 3D module below never
     arrives, everything here still works on a flat console.
     ═══════════════════════════════════════════════════════════ -->
<script type="module" src="assets/js/console.js"></script>

<!-- ═══════════════════════════════════════════════════════════════
     THE OBJECT — the machine itself, in three dimensions.
     Loaded on its own. If it never arrives, the flat console above
     takes over and nothing is lost but the plastic.
     ═══════════════════════════════════════════════════════════ -->
<script type="module" src="assets/js/device.js"></script>
</body>
</html>
