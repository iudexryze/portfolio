<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Heap</title>
<meta name="description" content="Stack the tower. One tap per block, and every millimetre of overhang is gone for good.">
<meta name="theme-color" content="#131211">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131211; --sunken:#0E0D0C; --rule:#322E28; --dim:#8C8577; --mid:#B4AC9D;
  --f:'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%; overscroll-behavior:none}
body{
  margin:0; background:var(--sunken); color:var(--mid);
  font-family:var(--f); font-size:14px;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
.stage{position:relative; flex:1 1 auto; min-height:0}
canvas{
  position:absolute; inset:0; width:100%; height:100%; display:block;
  touch-action:none; user-select:none;
}
.hint{
  flex:0 0 auto; margin:0; padding:7px 10px 9px; text-align:center;
  font-size:10.5px; letter-spacing:.09em; color:var(--dim);
  text-transform:uppercase; border-top:1px solid var(--rule); background:var(--ink);
}
@media (max-height:420px){ .hint{display:none} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Heap, a precision block stacking game"></canvas>
</div>
<p class="hint">tap or press space to drop &middot; overhang is lost &middot; R restart</p>

<script>
(function () {
'use strict';

var stage = document.getElementById('stage');
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var FONT = "'IBM Plex Mono', ui-monospace, Consolas, monospace";
var COL = { amber:'#F0902E', live:'#86C232', bad:'#D9484B', bone:'#EDE8DE', mid:'#B4AC9D', dim:'#8C8577' };
/* A ramp rather than one colour: the tower reads its own height back to
   you without a number, and a run you are proud of looks like one. */
var RAMP = ['#86C232', '#9DC53A', '#B4C63C', '#CBB93C', '#DFA637', '#F0902E'];

var W = 320, H = 520, dpr = 1, S = 1;
var BH = 26, GROUND = 70, MARGIN = 0;

function fit() {
  var r = stage.getBoundingClientRect();
  W = Math.max(240, Math.round(r.width));
  H = Math.max(240, Math.round(r.height));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;

  S = Math.max(0.68, Math.min(1.25, Math.min(W, H) / 560));
  BH = Math.max(15, Math.min(32, Math.round(H / 17)));
  GROUND = Math.round(H * 0.12);
  MARGIN = Math.round(Math.min(W * 0.06, 34));
}
fit();
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

function rnd(a, b) { return a + Math.random() * (b - a); }
function font(size, weight) { return (weight || 400) + ' ' + Math.round(size * S) + 'px ' + FONT; }

/* ── State ─────────────────────────────────────────────────────────
   Blocks are stored in fractions of the canvas width, so a resize
   mid-run rescales the tower instead of invalidating it. */
var blocks, live, debris, camY, camTarget;
var height, score, combo, best = 0, state = 'title', shake = 0, tick = 0, ended = '';
try { best = parseInt(localStorage.getItem('heap.best'), 10) || 0; } catch (e) {}

function reset() {
  var w = 0.42;
  blocks = [{ x: 0.5 - w / 2, w: w }];
  debris = [];
  height = 1; score = 0; combo = 0; camY = 0; camTarget = 0;
  shake = 0; ended = '';
  spawn();
  state = 'play';
}

function spawn() {
  var top = blocks[blocks.length - 1];
  var fromLeft = height % 2 === 0;
  live = {
    x: fromLeft ? 0 : 1 - top.w,
    w: top.w,
    dir: fromLeft ? 1 : -1,
    /* Speed is in canvas-widths per step, so the block crosses the
       screen in the same time whatever the screen is. */
    spd: Math.min(0.016, 0.0042 + height * 0.00022)
  };
}

function blockY(i) { return H - GROUND - (i + 1) * BH + camY; }

function drop() {
  if (state === 'title') { reset(); return; }
  if (state === 'over')  { reset(); return; }

  var top = blocks[blocks.length - 1];
  var lo = Math.max(live.x, top.x), hi = Math.min(live.x + live.w, top.x + top.w);
  var overlap = hi - lo;

  if (overlap <= 0.004) {
    debris.push(slab(live.x, blockY(height), live.w, live.dir * 3.2));
    ended = 'missed the stack entirely';
    finish();
    return;
  }

  var off = Math.abs(live.x - top.x);
  var perfect = off < 0.008;

  if (perfect) {
    /* A clean landing hands back a sliver of what earlier sloppiness
       cost, which is the only way a long run stays possible. */
    combo++;
    var give = Math.min(0.012, (0.42 - overlap) * 0.25);
    lo = Math.max(0, Math.min(1 - (overlap + give), lo - give / 2));
    overlap = Math.min(0.42, overlap + give);
    score += 25 + combo * 15;
    burst(lo + overlap / 2, blockY(height), combo > 3 ? 'amber' : 'live');
  } else {
    combo = 0;
    score += 10;
    var lossX = live.x < top.x ? live.x : hi;
    debris.push(slab(lossX, blockY(height), live.w - overlap, live.x < top.x ? -2.6 : 2.6));
  }

  blocks.push({ x: lo, w: overlap, perfect: perfect });
  height++;
  shake = perfect ? 3 : 1.4;

  if (overlap < 0.022) {
    ended = 'the tower ran out of width';
    finish();
    return;
  }
  spawn();
}

function finish() {
  state = 'over';
  shake = 14;
  score = Math.round(score + height * 20);
  if (score > best) {
    best = score;
    try { localStorage.setItem('heap.best', String(best)); } catch (e) {}
  }
}

function slab(x, y, w, vx) {
  return { x: x, y: y, w: Math.max(0.004, w), vx: vx, vy: -1.6, rot: 0, spin: vx * 0.02, life: 150 };
}

function burst(x, y, col) {
  for (var i = 0; i < 16; i++) {
    var a = rnd(0, Math.PI * 2), s = rnd(0.4, 1) * 3.4;
    debris.push({
      part: true, x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      life: rnd(16, 34), max: 34, col: col
    });
  }
}

/* ── Input ─────────────────────────────────────────────────────── */
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); drop(); });
addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); drop(); }
  if (e.code === 'KeyR') reset();
});

/* ── Simulation ────────────────────────────────────────────────── */
function step() {
  tick++;
  if (shake > 0) shake *= 0.85;

  for (var i = debris.length - 1; i >= 0; i--) {
    var d = debris[i];
    d.x += d.part ? d.vx / W : d.vx / W;
    d.y += d.vy;
    d.vy += d.part ? 0.16 : 0.42;
    if (d.rot !== undefined) d.rot += d.spin;
    if (--d.life <= 0 || d.y > H + 200) debris.splice(i, 1);
  }

  if (state !== 'play') return;

  live.x += live.spd * live.dir;
  if (live.x <= 0) { live.x = 0; live.dir = 1; }
  if (live.x + live.w >= 1) { live.x = 1 - live.w; live.dir = -1; }

  camTarget = Math.max(0, (height + 2) * BH - (H - GROUND - H * 0.42));
  camY += (camTarget - camY) * 0.12;
}

/* ── Render ────────────────────────────────────────────────────── */
function X(fx) { return MARGIN + fx * (W - MARGIN * 2); }
function WD(fw) { return fw * (W - MARGIN * 2); }

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (shake > 0.3) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));

  ctx.fillStyle = '#0E0D0C';
  ctx.fillRect(-30, -30, W + 60, H + 60);

  drawGuides();
  drawTower();
  drawDebris();
  if (state === 'play') drawLive();
  drawGround();
  drawHud();

  if (state === 'title') {
    panel('HEAP', [
      'A block slides across the top of the stack.',
      'Tap to drop it. Whatever hangs over is cut off and gone.',
      'Land one dead centre and you get a sliver back.'
    ], 'tap anywhere to start', COL.live);
  } else if (state === 'over') {
    panel('COLLAPSE', [
      ended,
      height + ' blocks   ·   ' + score + ' points   ·   best ' + best
    ], 'tap to build again', COL.bad);
  }
}

/* Two rails marking the centre line the perfect landing wants. */
function drawGuides() {
  var cx = X(0.5);
  ctx.strokeStyle = 'rgba(50,46,40,.75)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
  ctx.stroke();
  ctx.setLineDash([]);
}

function blockFill(i) { return RAMP[i % RAMP.length]; }

function drawTower() {
  for (var i = 0; i < blocks.length; i++) {
    var y = blockY(i);
    if (y > H + BH || y < -BH * 2) continue;
    var b = blocks[i], col = blockFill(i);

    ctx.fillStyle = '#17150F';
    ctx.fillRect(X(b.x), y, WD(b.w), BH);
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.22;
    ctx.fillRect(X(b.x), y, WD(b.w), BH);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.strokeRect(X(b.x) + 1, y + 1, Math.max(1, WD(b.w) - 2), BH - 2);

    if (b.perfect) {
      ctx.fillStyle = col;
      ctx.fillRect(X(b.x) + 1, y + 1, Math.max(1, WD(b.w) - 2), 3);
    }
  }
}

function drawLive() {
  var y = blockY(height), col = blockFill(height);
  ctx.fillStyle = '#1B1917';
  ctx.fillRect(X(live.x), y, WD(live.w), BH);
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.strokeRect(X(live.x) + 1, y + 1, Math.max(1, WD(live.w) - 2), BH - 2);

  /* A dropline, because at speed the eye tracks the falling column and
     not the block itself. */
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.2;
  ctx.lineWidth = 1;
  ctx.beginPath();
  var cx = X(live.x + live.w / 2);
  ctx.moveTo(cx, y + BH); ctx.lineTo(cx, blockY(height - 1));
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawDebris() {
  for (var i = 0; i < debris.length; i++) {
    var d = debris[i];
    if (d.part) {
      ctx.globalAlpha = Math.max(0, d.life / d.max) * 0.9;
      ctx.fillStyle = COL[d.col];
      ctx.fillRect(X(d.x) - 2, d.y - 2, 4, 4);
    } else {
      ctx.save();
      ctx.translate(X(d.x) + WD(d.w) / 2, d.y + BH / 2);
      ctx.rotate(d.rot);
      ctx.globalAlpha = Math.min(1, d.life / 40);
      ctx.strokeStyle = COL.bad;
      ctx.lineWidth = 2;
      ctx.strokeRect(-WD(d.w) / 2, -BH / 2, Math.max(1, WD(d.w)), BH);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  var y = H - GROUND + camY;
  if (y > H + 4) return;
  ctx.fillStyle = '#131211';
  ctx.fillRect(0, y, W, H - y + 30);
  ctx.strokeStyle = '#443E36';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, y + 1); ctx.lineTo(W, y + 1); ctx.stroke();
}

function drawHud() {
  ctx.textAlign = 'left';
  ctx.font = font(10.5);
  ctx.fillStyle = COL.dim;
  ctx.fillText('HEIGHT', 14, 22);
  ctx.font = font(24, 600);
  ctx.fillStyle = COL.bone;
  ctx.fillText(String(height), 14, 48);

  if (combo > 1) {
    ctx.font = font(11, 500);
    ctx.fillStyle = COL.amber;
    ctx.fillText(combo + ' CLEAN', 14, 66);
  }

  ctx.textAlign = 'right';
  ctx.font = font(10.5);
  ctx.fillStyle = COL.dim;
  ctx.fillText('SCORE', W - 14, 22);
  ctx.font = font(19, 600);
  ctx.fillStyle = COL.bone;
  ctx.fillText(String(Math.round(score)), W - 14, 46);
  ctx.font = font(10.5);
  ctx.fillStyle = COL.dim;
  ctx.fillText('BEST ' + best, W - 14, 64);
  ctx.textAlign = 'left';
}

function wrap(text, max) {
  var words = text.split(' '), lines = [], line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > max && line) { lines.push(line); line = words[i]; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function panel(title, body, foot, accent) {
  ctx.fillStyle = 'rgba(14,13,12,.88)';
  ctx.fillRect(0, 0, W, H);

  var bw = Math.min(W - 28, 520 * S), inner = bw - 44;
  ctx.font = font(13);
  var lines = [];
  for (var b = 0; b < body.length; b++) lines = lines.concat(wrap(body[b], inner));

  var lh = Math.round(21 * S), th = Math.round(30 * S);
  var bh = th + 26 + lines.length * lh + lh + 22 + 26;
  var bx = (W - bw) / 2, by = (H - bh) / 2;

  ctx.fillStyle = '#1B1917';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#322E28';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);
  ctx.fillStyle = accent;
  ctx.fillRect(bx, by, bw, 2);

  ctx.textAlign = 'center';
  var y = by + 26 + th * 0.72;
  ctx.font = font(23, 600);
  ctx.fillStyle = accent;
  ctx.fillText(title, W / 2, y);

  y += 22 * S;
  ctx.font = font(13);
  ctx.fillStyle = COL.mid;
  for (var i = 0; i < lines.length; i++) { y += lh; ctx.fillText(lines[i], W / 2, y); }

  y += lh + 10;
  ctx.fillStyle = COL.dim;
  ctx.fillText(foot, W / 2, y);
  ctx.textAlign = 'left';
}

/* ── Loop ──────────────────────────────────────────────────────── */
var acc = 0, last = 0, STEP = 1000 / 60;
addEventListener('blur', function () { last = 0; });
addEventListener('visibilitychange', function () { last = 0; });

function frame(now) {
  if (!last) last = now;
  acc += Math.min(now - last, 100);
  last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

reset();
state = 'title';
requestAnimationFrame(frame);
try { window.focus(); } catch (e) {}
})();
</script>
</body>
</html>
